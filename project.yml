name: AllYouNeedQuickLook
options:
  deploymentTarget:
    macOS: "15.0"
  bundleIdPrefix: com.yohanpark
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual

targets:
  AllYouNeedQuickLook:
    type: application
    platform: macOS
    sources:
      - AllYouNeedQuickLook
    dependencies:
      - target: Shared
      - target: QuickLookExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "All You Need QuickLook"
        # AllYouNeedQuickLook/Assets.xcassets, generated from
        # assets/brand/all-you-need-quicklook-v1.png fitted to the 824/1024 macOS grid.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: AllYouNeedQuickLook/AllYouNeedQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Sandboxed WKWebView needs its network process even for local HTML.
        com.apple.security.network.client: true
        # Settings live in ~/Library/Application Support/AllYouNeedQuickLook/;
        # the host is the only writer.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/AllYouNeedQuickLook/
    postBuildScripts:
      # Runs after the extension has been embedded, so it can sign the whole
      # bundle inside-out. See scripts/adhoc-sign.sh for why Xcode cannot do
      # this itself.
      - script: "\"$SRCROOT/scripts/adhoc-sign.sh\""
        name: Ad-hoc sign bundle
        basedOnDependencyAnalysis: false

  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - QuickLookExtension
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.QuickLookExtension
    info:
      path: QuickLookExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          # QuickLook only reads QLSupportedContentTypes from inside
          # NSExtensionAttributes. At the top level of Info.plist it is
          # ignored, the extension declares no supported types, and
          # quicklookd never considers it for any file -- it does not even
          # log a rejection. Verified in Finder on macOS 26.
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.plain-text
              - com.apple.log
              - net.daringfireball.markdown
              - org.jupyter.notebook
              # public.json / public.yaml / public.toml hang off public.text
              # directly -- they do NOT conform to public.plain-text -- so
              # without naming each one quicklookd never considers this
              # extension for a .json, .yaml/.yml, .toml or .cfg file and logs
              # nothing at all. Verified with UTType on macOS 26.
              #
              # Source code the system types (.swift, .py, .js, .sh ...) needs
              # no entry: it reaches public.plain-text through
              # public.source-code. .go and .rs are not system types; see
              # UTImportedTypeDeclarations below.
              # Deliberately absent: public.xml and .csv-style delimited text
              # are left to the system preview, and .ts resolves to
              # public.mpeg-2-transport-stream, a movie type.
              - public.json
              - public.yaml
              - public.toml
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.notebook
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - ipynb
        # macOS declares no type for .go or .rs. Where an editor imports one
        # they resolve to source code; on a clean Mac they are dynamic types
        # that conform to nothing, and quicklookd never asks this extension.
        # Importing them gives the public.plain-text route on every Mac. The
        # identifiers match the ones editors such as CotEditor import, so the
        # two declarations agree wherever both exist.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.golang.go-script
            UTTypeDescription: Go Source
            UTTypeConformsTo:
              - public.source-code
            UTTypeTagSpecification:
              public.filename-extension:
                - go
          - UTTypeIdentifier: org.rust-lang.rust-script
            UTTypeDescription: Rust Source
            UTTypeConformsTo:
              - public.source-code
            UTTypeTagSpecification:
              public.filename-extension:
                - rs
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: QuickLookExtension/QuickLookExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Reads config.json and the previewed document's neighbours.
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /

  Shared:
    type: framework
    platform: macOS
    sources:
      - Shared
    resources:
      - Shared/Resources/**
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.Shared

  Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - QuickLookExtension/PreviewViewController.swift
    dependencies:
      - target: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AllYouNeedQuickLook:
    build:
      targets:
        AllYouNeedQuickLook: all
  Tests:
    build:
      targets:
        Tests: all
    test:
      targets:
        - Tests
