name: AllYouNeedQuickLook
options:
  deploymentTarget:
    macOS: "15.0"
  bundleIdPrefix: com.yohanpark
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual

targets:
  AllYouNeedQuickLook:
    type: application
    platform: macOS
    sources:
      - AllYouNeedQuickLook
    dependencies:
      - target: Shared
      - target: QuickLookExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "All You Need QuickLook"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: AllYouNeedQuickLook/AllYouNeedQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.yohanpark.AllYouNeedQuickLook
    postBuildScripts:
      # Runs after the extension has been embedded, so it can sign the whole
      # bundle inside-out. See scripts/adhoc-sign.sh for why Xcode cannot do
      # this itself.
      - script: "\"$SRCROOT/scripts/adhoc-sign.sh\""
        name: Ad-hoc sign bundle
        basedOnDependencyAnalysis: false

  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - QuickLookExtension
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.QuickLookExtension
    info:
      path: QuickLookExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          # QuickLook only reads QLSupportedContentTypes from inside
          # NSExtensionAttributes. At the top level of Info.plist it is
          # ignored, the extension declares no supported types, and
          # quicklookd never considers it for any file -- it does not even
          # log a rejection. Verified in Finder on macOS 26.
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.plain-text
              - com.apple.log
              - net.daringfireball.markdown
              - org.jupyter.notebook
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.notebook
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - ipynb
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: QuickLookExtension/QuickLookExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.yohanpark.AllYouNeedQuickLook

  Shared:
    type: framework
    platform: macOS
    sources:
      - Shared
    resources:
      - Shared/Resources/**
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.Shared

  Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Shared

schemes:
  AllYouNeedQuickLook:
    build:
      targets:
        AllYouNeedQuickLook: all
  Tests:
    build:
      targets:
        Tests: all
    test:
      targets:
        - Tests
