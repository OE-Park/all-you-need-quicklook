name: AllYouNeedQuickLook
options:
  deploymentTarget:
    macOS: "15.0"
  bundleIdPrefix: com.yohanpark
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual

targets:
  AllYouNeedQuickLook:
    type: application
    platform: macOS
    sources:
      - AllYouNeedQuickLook
    dependencies:
      - target: Shared
      - target: QuickLookExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "All You Need QuickLook"
        # AllYouNeedQuickLook/Assets.xcassets, generated from
        # assets/brand/all-you-need-quicklook-v1.png fitted to the 824/1024 macOS grid.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AllYouNeedQuickLook/Info.plist
      properties:
        # Source declarations are shared by the host and extension.
        # System Settings controls extension activation; these declarations control eligibility.
        UTImportedTypeDeclarations: &sourceTypes
          - UTTypeIdentifier: com.yohanpark.all-you-need-quicklook.source.apache
            UTTypeDescription: Apache Source / Script
            UTTypeConformsTo: [public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: ["apache", "htaccess"]
          - UTTypeIdentifier: com.yohanpark.all-you-need-quicklook.source.armasm
