              - com.yohanpark.all-you-need-quicklook.source.scheme
              - com.yohanpark.all-you-need-quicklook.source.scss
              - com.yohanpark.all-you-need-quicklook.source.sql
              - com.yohanpark.all-you-need-quicklook.source.swift
              - com.yohanpark.all-you-need-quicklook.source.typescript
              - com.yohanpark.all-you-need-quicklook.source.vbnet
              - com.yohanpark.all-you-need-quicklook.source.verilog
              - com.yohanpark.all-you-need-quicklook.source.vhdl
              - com.yohanpark.all-you-need-quicklook.source.wasm
              - com.yohanpark.all-you-need-quicklook.source.xml
              - com.yohanpark.all-you-need-quicklook.source.yaml
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.notebook
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - ipynb
        UTImportedTypeDeclarations: *sourceTypes
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: QuickLookExtension/QuickLookExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Reads config.json and the previewed document's neighbours.
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /

  Shared:
    type: framework
    platform: macOS
    sources:
      - Shared
    resources:
      - Shared/Resources/**
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.Shared

  Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - QuickLookExtension/PreviewViewController.swift
    dependencies:
      - target: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AllYouNeedQuickLook:
    build:
      targets:
        AllYouNeedQuickLook: all
  Tests:
    build:
      targets:
        Tests: all
    test:
      targets:
        - Tests
