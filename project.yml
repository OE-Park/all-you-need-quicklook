    entitlements:
      path: AllYouNeedQuickLook/AllYouNeedQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Sandboxed WKWebView needs its network process even for local HTML.
        com.apple.security.network.client: true
        # Explicit JSON import grants access only to a user-selected file.
        com.apple.security.files.user-selected.read-only: true
        # Settings live in ~/Library/Application Support/AllYouNeedQuickLook/;
        # the host is the only writer.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/AllYouNeedQuickLook/
    postBuildScripts:
      # Runs after the extension has been embedded, so it can sign the whole
      # bundle inside-out. See scripts/adhoc-sign.sh for why Xcode cannot do
      # this itself.
      - script: "\"$SRCROOT/scripts/adhoc-sign.sh\""
        name: Ad-hoc sign bundle
        # Signing must wait until the custom host Info.plist has been processed.
        # Otherwise codesign can succeed with Info.plist=not bound, and sandbox
        # startup then aborts because the signature has no bundle identifier.
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false

  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - QuickLookExtension
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohanpark.AllYouNeedQuickLook.QuickLookExtension
    info:
      path: QuickLookExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          # QuickLook only reads QLSupportedContentTypes from inside
          # NSExtensionAttributes. At the top level of Info.plist it is
          # ignored, the extension declares no supported types, and
          # quicklookd never considers it for any file -- it does not even
          # log a rejection. Verified in Finder on macOS 26.
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.plain-text
              - com.apple.log
              - net.daringfireball.markdown
              - org.jupyter.notebook
              # Explicit source/script ancestors and concrete text formats.
              # Never claim public.data or the MPEG transport stream type for .ts.
              - public.source-code
              - public.script
              - public.xml
              - public.html
              - public.css
              - public.json
              - public.yaml
              - public.toml
              # Existing system/editor source types also need concrete eligibility.
              - com.apple.metal
              - com.apple.rez-source
              - com.apple.terminal.shell-script
              - com.fishshell.script
              - com.microsoft.ini
              - com.microsoft.typescript
              - com.netscape.javascript-source
              - com.sun.java-source
              - dev.svelte
              - org.clojure
              - org.iso.sql
