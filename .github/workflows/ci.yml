name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: >
          xcodebuild test
          -project AllYouNeedQuickLook.xcodeproj
          -scheme Tests
          -destination "platform=macOS"

      - name: Build host app
        run: >
          xcodebuild
          -project AllYouNeedQuickLook.xcodeproj
          -scheme AllYouNeedQuickLook
          -destination "platform=macOS"
          build
