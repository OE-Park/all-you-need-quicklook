name: Copilot Setup Steps

# Copilot cloud agent only supports Ubuntu x64 and Windows runners.
# It cannot run xcodebuild. Full macOS validation lives in ci.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm project spec is present
        run: |
          test -f project.yml
          test -f docs/superpowers/plans/2026-03-30-quicklook-extension.md
          echo "Repo layout is ready. Do not run xcodebuild here; CI on macos-26 does that."
